<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Mesma CSP restritiva do index.html vanilla: o bundle React é estático
       (gerado por `npm run build` em renderer-react/), sem chamadas de rede
       do renderer — tudo passa pelo IPC via window.audiofy (preload.js). -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'" />
  <title>Audiofy Content AI</title>
  <link rel="stylesheet" href="dist-react/app.css" />
</head>
<body>
  <div id="root"></div>
  <!-- status-view.js (regras de erro/progresso compartilhadas com o renderer
       vanilla) entra no próprio bundle, via src/lib/statusView.js. -->
  <script type="module" src="dist-react/app.js"></script>
</body>
</html>
